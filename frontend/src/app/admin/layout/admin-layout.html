<div class="wrapper">
  <div class="sidebar" data-background-color="white" [attr.data-color]="styleOfTheMenu">
    <div class="logo">
      <a class="simple-text logo-normal" routerLink="/admin/inicio">Administrador</a>
    </div>
    <div class="sidebar-wrapper">
      <ul class="nav">
        @for (link of links; track link.path) {
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" [routerLink]="['/admin', link.path]">
              <i class="material-icons">{{ link.icon }}</i>
              <p>{{ link.label }}</p>
            </a>
          </li>
        }
        <li class="nav-item">
          <a class="nav-link" routerLink="/inicio">
            <i class="material-icons">public</i>
            <p>Ver sitio</p>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="main-panel">
    <nav class="navbar navbar-expand-lg navbar-transparent navbar-absolute fixed-top">
      <div class="container-fluid">
        <div class="navbar-wrapper">
          <span class="navbar-brand">{{ seccion() }}</span>
        </div>
        <button aria-label="Toggle navigation" class="navbar-toggler" type="button" (click)="sidebarOpen.set(!sidebarOpen())">
          <span class="sr-only">Toggle navigation</span>
          <span class="navbar-toggler-icon icon-bar"></span>
          <span class="navbar-toggler-icon icon-bar"></span>
          <span class="navbar-toggler-icon icon-bar"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end">
          <ul class="navbar-nav">
            <li class="nav-item dropdown" [class.show]="menuCuentaAbierto()">
              <a class="nav-link u-pointer" aria-haspopup="true" [attr.aria-expanded]="menuCuentaAbierto()"
                 (click)="menuCuentaAbierto.set(!menuCuentaAbierto())">
                <i class="material-icons">person</i>
                <p class="d-lg-none d-md-block">Account</p>
              </a>
              <div class="dropdown-menu dropdown-menu-right" [class.show]="menuCuentaAbierto()" [attr.data-color]="styleOfTheMenu">
                <a class="dropdown-item" routerLink="/admin/perfil">Perfil</a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item u-pointer" (click)="logout()">Salir</a>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="content">
      <div class="container-fluid">
        <router-outlet />
      </div>
    </div>
  </div>
</div>

<!-- capa que material-dashboard pone detrás del sidebar abierto en móvil -->
@if (sidebarOpen()) {
  <div class="close-layer visible" (click)="sidebarOpen.set(false)"></div>
}
